name: Refresh Registry from WranglesPY

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: WranglesPY branch, tag or commit to read
        default: main
        required: true
        type: string
      commit_changes:
        description: Commit validated changes to main (false = downloadable preview only)
        default: false
        type: boolean
      publish:
        description: Run Publish Latest after committing (requires commit_changes)
        default: false
        type: boolean

concurrency:
  group: registry-refresh
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check publish options
        env:
          COMMIT: ${{ inputs.commit_changes }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$PUBLISH" = true ] && [ "$COMMIT" != true ]; then
            echo 'publish requires commit_changes'; exit 1
          fi
          if [ "$COMMIT" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Committing is only supported when running this workflow on main'; exit 1
          fi
      - uses: actions/checkout@v6
        with:
          repository: wrangleworks/WranglesPY
          ref: ${{ inputs.upstream_ref }}
          path: .upstream-wranglespy
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: wrangles-docs/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: wrangles-docs
      - name: Refresh, validate and build in isolation
        run: python3 scripts/refresh_registry.py --checkout .upstream-wranglespy
      - name: Package preview
        run: |
          git diff --binary > registry-refresh-report/tracked-changes.patch
          tar -czf registry-refresh-report/registry-output.tar.gz registry wrangles-docs/registry-docs wrangles-docs/static/registry wrangles-docs/static/schemas/recipes wrangles-docs/static/py wrangles-docs/sidebarsRegistry.js wrangles-docs/requirements.txt wrangles-docs/src/components/WrangleFlowPlayground/registryCatalog.generated.js
      - name: Upload report and generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-refresh-${{ github.run_id }}
          path: registry-refresh-report/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit validated changes
        if: inputs.commit_changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry wrangles-docs/registry-docs wrangles-docs/static/registry wrangles-docs/static/schemas/recipes wrangles-docs/static/py wrangles-docs/sidebarsRegistry.js wrangles-docs/requirements.txt wrangles-docs/src/components/WrangleFlowPlayground/registryCatalog.generated.js
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh Registry from WranglesPY schema'
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN pushes do not trigger push workflows. Dispatch explicitly.
      - name: Publish validated main
        if: inputs.commit_changes && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
