name: Sync catalog identity and history from WranglesPY

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'WranglesPY metadata branch (use main after its PR is merged)'
        required: true
        type: string
      apply_changes:
        description: 'Write the validated changes to the database (false previews only)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: catalog-history-sync
  cancel-in-progress: false

jobs:
  schema:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: wrangleworks/WranglesPY
          ref: ${{ inputs.upstream_ref }}
          path: .upstream-wranglespy
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Upstream code runs here, without VPN or database credentials.
      - name: Generate schema from the selected WranglesPY revision
        id: source
        working-directory: .upstream-wranglespy
        run: |
          python -m pip install . pyyaml jsonschema
          git rev-parse HEAD > schema/source-revision.txt
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python ../scripts/export_wranglespy_inventory.py . > schema/inventory.json
          cd schema
          python generate_recipe_schema.py
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-upstream-schema
          path: |
            .upstream-wranglespy/schema/schema.json
            .upstream-wranglespy/schema/source-revision.txt
            .upstream-wranglespy/schema/inventory.json
          retention-days: 7

  sync:
    needs: schema
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    environment: api-core-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/checkout@v6
        with:
          repository: wrangleworks/WranglesPY
          ref: ${{ needs.schema.outputs.revision }}
          path: .upstream-wranglespy
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: catalog-upstream-schema
          path: upstream-schema
      - name: Install tools before VPN connection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools systemd-resolved
          sudo systemctl start systemd-resolved
          command -v resolvconf
          python -m pip install 'psycopg[binary]>=3.2,<4'
          python scripts/test_sync_catalog_history.py
          npm ci --prefix wrangles-docs
      - name: Reconcile catalog over VPN
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY_CHANGES: ${{ inputs.apply_changes }}
        run: |
          set -euo pipefail
          cleanup() {
            sudo wg-quick down wg-catalog >/dev/null 2>&1 || true
            sudo rm -f /etc/wireguard/wg-catalog.conf
            rm -f "$RUNNER_TEMP/catalog-vpn.log"
          }
          trap cleanup EXIT
          umask 077
          sudo install -d -m 700 /etc/wireguard
          test -n "$WIREGUARD_CONFIG"
          printf '%s\n' "$WIREGUARD_CONFIG" | sudo tee /etc/wireguard/wg-catalog.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg-catalog.conf
          unset WIREGUARD_CONFIG
          if ! sudo timeout 45 wg-quick up wg-catalog >"$RUNNER_TEMP/catalog-vpn.log" 2>&1; then
            echo 'VPN setup failed'; exit 1
          fi
          args=()
          if [ "$APPLY_CHANGES" = true ]; then args+=(--apply --catalog-output "$RUNNER_TEMP/catalog-after-sync.json"); fi
          python scripts/sync_catalog_history.py upstream-schema/schema.json --inventory upstream-schema/inventory.json "${args[@]}"
      - name: Ensure VPN cleanup
        if: always()
        run: |
          sudo wg-quick down wg-catalog >/dev/null 2>&1 || true
          sudo rm -f /etc/wireguard/wg-catalog.conf
          rm -f "$RUNNER_TEMP/catalog-vpn.log"
      - name: Import catalog and refresh documentation from the same upstream revision
        if: inputs.apply_changes
        run: |
          node wrangles-docs/scripts/import-catalog-snapshot.cjs "$RUNNER_TEMP/catalog-after-sync.json"
          python scripts/refresh_registry.py --checkout .upstream-wranglespy
      - name: Push validated catalog and documentation to a review branch
        if: inputs.apply_changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry wrangles-docs/registry-docs wrangles-docs/static/registry wrangles-docs/static/schemas/recipes wrangles-docs/static/py wrangles-docs/sidebarsRegistry.js wrangles-docs/requirements.txt wrangles-docs/src/components/WrangleFlowPlayground/registryCatalog.generated.js
          if ! git diff --cached --quiet; then
            branch="catalog-sync/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git commit -m 'docs: sync catalog lifecycle and refresh Registry'
            git push origin "HEAD:refs/heads/$branch"
            echo "### Documentation ready to merge" >> "$GITHUB_STEP_SUMMARY"
            echo "Branch: \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
            echo "[Review and create a pull request](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1)" >> "$GITHUB_STEP_SUMMARY"
            echo 'The database has been updated. Merge this branch to update the documentation on main.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No catalog or documentation file changes to commit.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove temporary catalog response
        if: always()
        run: rm -f "$RUNNER_TEMP/catalog-after-sync.json"
      - name: Record upstream revision
        run: |
          echo 'WranglesPY source revision:' >> "$GITHUB_STEP_SUMMARY"
          cat upstream-schema/source-revision.txt >> "$GITHUB_STEP_SUMMARY"
