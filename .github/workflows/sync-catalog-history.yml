name: Sync catalog identity and history from WranglesPY

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'WranglesPY metadata branch (use main after its PR is merged)'
        required: true
        type: string
      apply_changes:
        description: 'Write the validated changes to the database (false previews only)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: catalog-history-sync
  cancel-in-progress: false

jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          repository: wrangleworks/WranglesPY
          ref: ${{ inputs.upstream_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Upstream code runs here, without VPN or database credentials.
      - name: Generate schema from the selected WranglesPY revision
        run: |
          python -m pip install . pyyaml jsonschema
          git rev-parse HEAD > schema/source-revision.txt
          cd schema
          python generate_recipe_schema.py
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-upstream-schema
          path: |
            schema/schema.json
            schema/source-revision.txt
          retention-days: 7

  sync:
    needs: schema
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/catalog-history-sync'
    environment: api-core-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: catalog-upstream-schema
          path: upstream-schema
      - name: Install tools before VPN connection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools systemd-resolved
          sudo systemctl start systemd-resolved
          command -v resolvconf
          python -m pip install 'psycopg[binary]>=3.2,<4'
          python scripts/test_sync_catalog_history.py
      - name: Reconcile catalog over VPN
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY_CHANGES: ${{ inputs.apply_changes }}
        run: |
          set -euo pipefail
          cleanup() {
            sudo wg-quick down wg-catalog >/dev/null 2>&1 || true
            sudo rm -f /etc/wireguard/wg-catalog.conf
            rm -f "$RUNNER_TEMP/catalog-vpn.log"
          }
          trap cleanup EXIT
          umask 077
          sudo install -d -m 700 /etc/wireguard
          test -n "$WIREGUARD_CONFIG"
          printf '%s\n' "$WIREGUARD_CONFIG" | sudo tee /etc/wireguard/wg-catalog.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg-catalog.conf
          unset WIREGUARD_CONFIG
          if ! sudo timeout 45 wg-quick up wg-catalog >"$RUNNER_TEMP/catalog-vpn.log" 2>&1; then
            echo 'VPN setup failed'; exit 1
          fi
          args=()
          if [ "$APPLY_CHANGES" = true ]; then args+=(--apply); fi
          python scripts/sync_catalog_history.py upstream-schema/schema.json "${args[@]}"
      - name: Ensure VPN cleanup
        if: always()
        run: |
          sudo wg-quick down wg-catalog >/dev/null 2>&1 || true
          sudo rm -f /etc/wireguard/wg-catalog.conf
          rm -f "$RUNNER_TEMP/catalog-vpn.log"
      - name: Record upstream revision
        run: |
          echo 'WranglesPY source revision:' >> "$GITHUB_STEP_SUMMARY"
          cat upstream-schema/source-revision.txt >> "$GITHUB_STEP_SUMMARY"
