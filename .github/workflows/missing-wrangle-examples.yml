name: List wrangle pages missing examples

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: List pages missing YAML or sample tables
        run: python scripts/list_missing_examples.py
      - uses: actions/upload-artifact@v4
        with:
          name: missing-wrangle-examples
          path: audits/missing-wrangle-examples.csv
          if-no-files-found: error
